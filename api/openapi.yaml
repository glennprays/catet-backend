openapi: 3.1.0
info:
  title: catet Backend API
  version: 0.4.0
  description: |
    Internal Go API consumed only by the catet Next.js BFF.

    Conventions:
    - Every response is an envelope with exactly one of `data`/`error` plus `trace_id`.
    - Money is int64 minor units (IDR cents = rupiah). Never floats.
    - Day boundaries and date params are Asia/Jakarta; storage is UTC (timestamptz).
    - Errors carry a stable machine `code` (apperror.Kind) plus optional FieldError[].
    - Sessions slide: a request carrying a token 7 days old or older is answered with
      `X-Session-Renew`, a freshly minted session JWT that the BFF re-sets as its cookie.
servers:
  - url: /
    description: Internal API root
security: []
paths:
  # ---------------------------------------------------------------- system
  /api/v1/health:
    get:
      summary: Health check endpoint
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: Server is healthy
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/version:
    get:
      summary: Build metadata endpoint
      operationId: getVersion
      tags: [System]
      responses:
        '200':
          description: Build metadata
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionEnvelope'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  # ------------------------------------------------------------------ auth
  /api/v1/auth/login:
    post:
      summary: Exchange phone + password for a session JWT
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  description: Phone in any local or international shape; normalised server-side
                  example: "+628123456789"
                password: { type: string }
      responses:
        '200':
          description: Session token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          description: Unknown number or wrong password — deliberately indistinguishable
          $ref: '#/components/responses/ErrorResponse'
        '403':
          description: |
            FORBIDDEN with `details[0].field = "account"` and `rule` either
            `locked` (five consecutive failures; 15 minutes) or `deactivated`.
          $ref: '#/components/responses/ErrorResponse'
        '429':
          description: Too many attempts for this number or from this address
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/otp/request:
    post:
      summary: Request a WhatsApp OTP code
      operationId: requestOtp
      tags: [Auth]
      description: |
        A code is sent only to a registered active number (password reset)
        or a number holding an open invite (signup). The response is
        `{sent: true}` in every case, including an unknown number, so the
        endpoint cannot be used to discover who has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+628123456789"
      responses:
        '200':
          description: Accepted (log sender in dev prints the code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestEnvelope'
        '429':
          description: A code was requested for this number less than 60s ago, or too many requests from this address
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/invites/{token}:
    get:
      summary: Resolve a register link
      operationId: getInvite
      tags: [Auth]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The number this invite is bound to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteInfoEnvelope'
        '404':
          description: Unknown, spent or expired invite
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/register:
    post:
      summary: Create the account behind an invite and log it in
      operationId: register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, code, display_name, password]
              properties:
                invite_token: { type: string }
                code: { type: string, example: "123456" }
                display_name: { type: string, maxLength: 60 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: Account created, seeded and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '400':
          description: |
            Wrong or expired code, or VALIDATION_FAILED on `display_name`
            or `password` (field `password`, rule `min` | `max` | `common`).
          $ref: '#/components/responses/ErrorResponse'
        '404':
          description: Unknown, spent or expired invite
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: The number is already registered
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/password/reset/verify:
    post:
      summary: Trade a WhatsApp code for a short-lived reset token
      operationId: verifyPasswordReset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: "123456" }
      responses:
        '200':
          description: Reset token issued (15 minutes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetTokenEnvelope'
        '400':
          description: |
            Wrong or expired code — the same answer an unregistered number
            gets, so the form cannot enumerate accounts.
          $ref: '#/components/responses/ErrorResponse'
        '429':
          description: Too many requests from this address
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/password/reset/complete:
    post:
      summary: Set a new password with a reset token and log in
      operationId: completePasswordReset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, password]
              properties:
                reset_token: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: Password set; session issued at the new epoch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '400':
          description: |
            Unknown, spent or expired reset token, or VALIDATION_FAILED on
            `password` (rule `min` | `max` | `common`).
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/me:
    get:
      summary: The session's own account
      operationId: getMe
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Account identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/password/change:
    post:
      summary: Change the password of the calling account
      operationId: changePassword
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      description: |
        Bumps `session_epoch`, so every session — including the one that
        made this call — is invalidated. The client must send the user to
        the login screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: Password changed; all sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkEnvelope'
        '400':
          description: |
            The current password is wrong, or VALIDATION_FAILED on
            `new_password` (rule `min` | `max` | `common`).
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/logout-all:
    post:
      summary: Revoke every session of the calling account
      operationId: logoutAll
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ----------------------------------------------------------------- users
  /api/v1/users:
    get:
      summary: List accounts (admin only)
      operationId: listUsers
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Every account, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/users/invites:
    get:
      summary: List open invites (admin only)
      operationId: listInvites
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Invites still waiting to be accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitesEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Invite a phone number (admin only)
      operationId: createInvite
      tags: [Users]
      security: [{ bearerAuth: [] }]
      description: |
        The register link is delivered by the bot over WhatsApp; the token
        is never returned here, so possession of the number is part of the
        proof. Inviting a number that already has an open invite replaces
        it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+628999999999" }
      responses:
        '200':
          description: Invite created and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: The number is already registered
          $ref: '#/components/responses/ErrorResponse'
        '400':
          description: VALIDATION_FAILED — the phone is not a valid number (field `phone`, rule `format`)
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/users/invites/{id}:
    delete:
      summary: Revoke an open invite (admin only)
      operationId: revokeInvite
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Invite revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/users/{id}/deactivate:
    post:
      summary: Disable an account and revoke its sessions (admin only)
      operationId: deactivateUser
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Refused — an admin cannot deactivate themselves
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/users/{id}/activate:
    post:
      summary: Re-enable an account (admin only)
      operationId: activateUser
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Account re-enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # --------------------------------------------------------------- sources
  /api/v1/sources:
    get:
      summary: List sources with ledger-computed balances
      operationId: listSources
      tags: [Sources]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Sources plus ready-to-render totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Create a source
      operationId: createSource
      tags: [Sources]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string, minLength: 1 }
                type: { type: string, enum: [cash, bank, ewallet, custom] }
                is_debt: { type: boolean, default: false }
                currency: { type: string, default: IDR }
      responses:
        '200':
          description: Created source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/sources/{id}:
    patch:
      summary: Rename a source, change its type, or toggle its debt flag
      operationId: updateSource
      tags: [Sources]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                type: { type: string, enum: [cash, bank, ewallet, custom] }
                is_debt: { type: boolean }
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      summary: Soft-archive a source
      operationId: archiveSource
      tags: [Sources]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivedEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Referenced by open (active) bills, or the source still holds a balance
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/sources/{id}/permanent:
    delete:
      summary: Permanently delete a source that has no transactions
      operationId: deleteSourcePermanently
      tags: [Sources]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Deleted; bills linking the source were unlinked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Source has transactions; archive it instead
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/sources/{id}/restore:
    post:
      summary: Lift the archive flag from a source
      operationId: restoreSource
      tags: [Sources]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Restored source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Source is not archived
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/sources/{id}/adjustments:
    post:
      summary: Write an adjustment journal against a source
      operationId: createAdjustment
      tags: [Sources]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: integer, format: int64, description: signed balance correction }
                note: { type: string }
      responses:
        '200':
          description: Adjustment transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  # ---------------------------------------------------------- transactions
  /api/v1/transactions:
    get:
      summary: List ledger items (keyset pagination, occurred_at DESC)
      operationId: listTransactions
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: source_id
          in: query
          schema: { type: string, format: uuid }
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: review_status
          in: query
          schema: { type: string, enum: [clean, needs_review] }
        - name: q
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: direction
          in: query
          schema: { type: string, enum: [expense, income, transfer, adjustment] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Ledger items page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Create a manual transaction (dashboard peer capture)
      operationId: createTransaction
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount_minor, source_id]
              properties:
                type: { type: string, enum: [expense, income, transfer, adjustment] }
                occurred_at: { type: string, format: date-time }
                occurred_date: { type: string, format: date, description: used when occurred_at absent (Asia/Jakarta) }
                amount_minor: { type: integer, format: int64 }
                source_id: { type: string, format: uuid }
                destination_source_id: { type: string, format: uuid, description: required for transfer }
                category_id: { type: string, format: uuid }
                note: { type: string }
                merchant: { type: string }
      responses:
        '200':
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '400':
          description: VALIDATION_FAILED with FieldError[] on rule violations
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/transactions/{id}:
    get:
      summary: Transaction detail with legs and edit history
      operationId: getTransaction
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      summary: Edit a transaction (legs rewritten, edit_history appended)
      operationId: updateTransaction
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_minor: { type: integer, format: int64 }
                occurred_at: { type: string, format: date-time }
                category_id: { type: string, format: uuid, nullable: true }
                note: { type: string, nullable: true }
                merchant: { type: string, nullable: true }
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Transaction is voided
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      summary: Void a transaction (soft, excluded from all math)
      operationId: voidTransaction
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidedEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/transactions/{id}/reversals:
    post:
      summary: Create a linked reversal (mirrored legs)
      operationId: reverseTransaction
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Reversal transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Already voided or already reversed
          $ref: '#/components/responses/ErrorResponse'
        '500':
