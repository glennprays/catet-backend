  # ----------------------------------------------------------- admin: llm
  /api/v1/admin/llm:
    get:
      summary: AI provider configuration (admin only)
      operationId: getLlmProvider
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      description: |
        The provider the bot uses right now. `source` says where it came
        from: `dashboard` once an admin has saved one, `env` while the
        server's LLM_* variables are still authoritative. The API key is
        write-only — only `api_key_set` and `api_key_last4` are returned.
      responses:
        '200':
          description: Current provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMProviderEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    put:
      summary: Save the AI provider (admin only)
      operationId: updateLlmProvider
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      description: |
        Takes effect on the next bot request, without a restart. `api_key`
        is tri-state: absent or null keeps the stored key, `""` clears it
        (AI off), any other value replaces it. A first save that names no
        key inherits the environment's, so the model can be changed
        without re-typing the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMProviderUpdate'
      responses:
        '200':
          description: Saved provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMProviderEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      summary: Drop the dashboard override (admin only)
      operationId: resetLlmProvider
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      description: >-
        Deletes the saved configuration; the instance falls back to its
        LLM_* environment variables. The answer is the provider now in
        effect, so `source` is `env`.
      responses:
        '200':
          description: Provider after the reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMProviderEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/admin/llm/models:
    post:
      summary: List the models a provider serves (admin only)
      operationId: listLlmModels
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      description: >-
        Proxies GET {base_url}/models so the dashboard can offer a picker
        before anything is saved. A POST because it carries the draft key,
        which does not belong in a query string. An absent `api_key` falls
        back to the stored key, then to the environment's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                base_url: { type: string, format: uri, example: 'https://api.openai.com/v1' }
                api_key:
                  type: string
                  nullable: true
                  description: Draft key; absent or empty uses the stored or environment key.
      responses:
        '200':
          description: Model ids, sorted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMModelsEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
        '502':
          description: UPSTREAM_ERROR — the provider refused or did not answer with a model list
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/admin/llm/test:
    post:
      summary: Test a provider (admin only)
      operationId: testLlmProvider
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      description: >-
        Sends one minimal completion to the draft provider and reports the
        round trip. Any 2xx is a pass; a provider error is returned
        verbatim as UPSTREAM_ERROR so the admin sees its own words.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMProviderUpdate'
      responses:
        '200':
          description: The provider answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMTestEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: FORBIDDEN — the caller is not the admin
          $ref: '#/components/responses/ErrorResponse'
        '502':
          description: UPSTREAM_ERROR — the provider refused; the message is its own
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    TraceId:
      description: Request trace identifier mirrored in the response envelope.
      schema:
        type: string
        format: uuid
    X-Session-Renew:
      description: >-
        Fresh session JWT; the BFF re-sets the httpOnly cookie. Sent when the
        presented token is >=7 days old.
      schema:
        type: string
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      schema: { type: string, format: date, description: Asia/Jakarta date; defaults to today-29 }
    To:
      name: to
      in: query
      schema: { type: string, format: date, description: Asia/Jakarta date; defaults to today }
  responses:
    ErrorResponse:
      description: Error envelope
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: VALIDATION_FAILED with FieldError details
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Missing or invalid bearer token
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Not found
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    # ------------------------------------------------------- system shapes
    HealthEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/HealthResponse'
        trace_id: { type: string, format: uuid }
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, enum: [ok] }
        timestamp: { type: string, format: date-time }
    VersionEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/VersionResponse'
        trace_id: { type: string, format: uuid }
    VersionResponse:
      type: object
      required: [version, commit, build_time]
      properties:
        version: { type: string, example: dev }
        commit: { type: string, example: unknown }
        build_time: { type: string, example: unknown }
    ErrorEnvelope:
      type: object
      required: [error, trace_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        trace_id: { type: string, format: uuid }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: apperror.Kind }
        message: { type: string }
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        rule: { type: string }
        message: { type: string }
    PageMeta:
      type: object
      properties:
        next_cursor: { type: string }
        prev_cursor: { type: string }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }

    # ---------------------------------------------------------------- auth
    OtpRequestEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [sent]
          properties:
            sent: { type: boolean, enum: [true] }
        trace_id: { type: string, format: uuid }
    OkEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean, enum: [true] }
        trace_id: { type: string, format: uuid }
    Session:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Session JWT. The BFF stores it in the httpOnly cookie and never forwards it to the browser.
        expires_at: { type: string, format: date-time }
    SessionEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/Session'
        trace_id: { type: string, format: uuid }
    InviteInfoEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [phone, expires_at]
          properties:
            phone: { type: string }
            expires_at: { type: string, format: date-time }
        trace_id: { type: string, format: uuid }
    ResetTokenEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [reset_token, expires_at]
          properties:
            reset_token: { type: string }
            expires_at: { type: string, format: date-time }
        trace_id: { type: string, format: uuid }
    Me:
      type: object
      required: [id, phone, display_name, is_admin]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        display_name: { type: string }
        is_admin: { type: boolean }
    MeEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/Me'
        trace_id: { type: string, format: uuid }

    # ----------------------------------------------------------------- users
    User:
      type: object
      required: [id, phone, display_name, is_admin, created_at]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        display_name: { type: string }
        is_admin: { type: boolean }
        deactivated_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    UserEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/User'
        trace_id: { type: string, format: uuid }
    UsersEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [users]
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/User'
        trace_id: { type: string, format: uuid }
    Invite:
      type: object
      required: [id, phone, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InviteEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/Invite'
        trace_id: { type: string, format: uuid }
    InvitesEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [invites]
          properties:
            invites:
              type: array
              items:
                $ref: '#/components/schemas/Invite'
        trace_id: { type: string, format: uuid }

    # ------------------------------------------------------------- sources
    Source:
      type: object
      required: [id, name, type, is_debt, currency, balance_minor, has_transactions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [cash, bank, ewallet, custom] }
        is_debt: { type: boolean }
        currency: { type: string }
        balance_minor: { type: integer, format: int64, description: Σ non-voided legs }
        has_transactions: { type: boolean, description: at least one leg ever referenced this source (voided included) }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    SourcesEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [sources, total_available_minor, total_debt_minor]
          properties:
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'
            total_available_minor: { type: integer, format: int64, description: Σ balances of non-debt sources }
            total_debt_minor: { type: integer, format: int64, description: Σ negative balances of debt sources (positive magnitude) }
        trace_id: { type: string, format: uuid }
    SourceEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/Source'
        trace_id: { type: string, format: uuid }
    ArchivedEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [archived]
          properties:
            archived: { type: boolean, enum: [true] }
        trace_id: { type: string, format: uuid }

    # -------------------------------------------------------- transactions
    LedgerItem:
      type: object
      required: [transaction_id, occurred_at, type, amount_minor, source_id, source_name, review_status, voided]
      properties:
        transaction_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        type: { type: string, enum: [expense, income, transfer, adjustment] }
        merchant: { type: string, nullable: true }
        note: { type: string, nullable: true }
        amount_minor: { type: integer, format: int64, description: user-perspective signed (expense −, income +, transfer −) }
        category_id: { type: string, format: uuid, nullable: true }
        category_name: { type: string, nullable: true }
        source_id: { type: string, format: uuid }
        source_name: { type: string }
        review_status: { type: string, enum: [clean, needs_review] }
        category_source: { type: string, enum: [rules, llm, user, import], nullable: true }
        category_confidence: { type: number, nullable: true }
        voided: { type: boolean }
        reverses_transaction_id: { type: string, format: uuid, nullable: true }
    TransactionListEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [transactions]
          properties:
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/LedgerItem'
        page:
          $ref: '#/components/schemas/PageMeta'
        trace_id: { type: string, format: uuid }
    TransactionLeg:
      type: object
      required: [id, signed_amount]
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid, nullable: true }
        source_name: { type: string, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        category_name: { type: string, nullable: true }
        signed_amount: { type: integer, format: int64 }
    EditHistoryEntry:
      type: object
      properties:
        edited_at: { type: string, format: date-time }
        changes:
          type: object
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}
    Transaction:
      type: object
      required: [id, occurred_at, origin, type, amount_minor, review_status, voided, legs, edit_history]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        origin: { type: string, enum: [whatsapp_text, whatsapp_photo, dashboard_manual, import] }
        type: { type: string, enum: [expense, income, transfer, adjustment] }
        merchant: { type: string, nullable: true }
        note: { type: string, nullable: true }
        amount_minor: { type: integer, format: int64, description: unsigned base amount }
        category_id: { type: string, format: uuid, nullable: true }
        category_name: { type: string, nullable: true }
        category_source: { type: string, enum: [rules, llm, user, import], nullable: true }
        category_confidence: { type: number, nullable: true }
        review_status: { type: string, enum: [clean, needs_review] }
        external_id: { type: string, nullable: true }
        reverses_transaction_id: { type: string, format: uuid, nullable: true }
        reverses_merchant: { type: string, nullable: true, description: merchant of the reversed transaction when present }
        bill_id:
          type: string
          format: uuid
          nullable: true
          description: set on the detail read when this transaction settled a bill occurrence
        bill_name: { type: string, nullable: true }
        edit_history:
          type: array
          items:
            $ref: '#/components/schemas/EditHistoryEntry'
        voided: { type: boolean }
        voided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        legs:
          type: array
          items:
            $ref: '#/components/schemas/TransactionLeg'
    TransactionEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/Transaction'
        trace_id: { type: string, format: uuid }
    VoidedEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [voided]
          properties:
            voided: { type: boolean, enum: [true] }
        trace_id: { type: string, format: uuid }

    # ---------------------------------------------------------- categories
    Category:
      type: object
      required: [id, name, essential]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        icon: { type: string, nullable: true }
        essential: { type: boolean }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CategoriesEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [categories]
          properties:
            categories:
              type: array
              items:
                $ref: '#/components/schemas/Category'
        trace_id: { type: string, format: uuid }
    CategoryEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/Category'
        trace_id: { type: string, format: uuid }

    # --------------------------------------------------------------- bills
    BillInput:
      type: object
      required: [name, amount_min_minor, amount_max_minor, cadence, next_due_date]
      properties:
        name: { type: string, minLength: 1 }
        amount_min_minor: { type: integer, format: int64 }
        amount_max_minor: { type: integer, format: int64 }
        cadence: { type: string, enum: [once, weekly, monthly, annual] }
        next_due_date: { type: string, format: date }
        linked_source_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        remaining_count:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Optional tenor: payments left before the bill completes. Null is
            open-ended. Not allowed with cadence=once.
        reminder_offsets:
          type: array
          description: >-
            Days before the due date the user opted into for the daily
            WhatsApp digest (ADR-0006). Empty means no reminders.
          items: { type: integer, enum: [0, 1, 3] }
    Bill:
      allOf:
        - $ref: '#/components/schemas/BillInput'
        - type: object
          required: [id, active, reminder_offsets]
          properties:
            id: { type: string, format: uuid }
            linked_source_id: { type: string, format: uuid, nullable: true }
            linked_source_name: { type: string, nullable: true }
            category_id: { type: string, format: uuid, nullable: true }
            category_name: { type: string, nullable: true }
            active: { type: boolean }
            completed_at:
              type: string
              format: date-time
              nullable: true
              description: set when the last occurrence was paid; a completed bill cannot be reactivated
            created_at: { type: string, format: date-time }
    BillPaymentInput:
      type: object
      required: [amount_minor]
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: what the user actually paid; the band is an estimate, never an authority
        source_id:
          type: string
          format: uuid
          nullable: true
          description: required when the bill has no linked source
        occurred_date: { type: string, format: date, nullable: true, description: defaults to today (Asia/Jakarta) }
    BillPayment:
      type: object
      required: [id, bill_id, bill_name, transaction_id, due_date, amount_minor, decremented, paid_at]
      properties:
        id: { type: string, format: uuid }
        bill_id: { type: string, format: uuid }
        bill_name: { type: string }
        transaction_id: { type: string, format: uuid }
        due_date: { type: string, format: date-time, description: the occurrence this payment settled }
        advanced_to:
          type: string
          format: date-time
          nullable: true
          description: where the bill was pushed; null when the payment completed it
        amount_minor: { type: integer, format: int64 }
        decremented: { type: boolean, description: whether this payment consumed one remaining_count }
        paid_at: { type: string, format: date-time }
    BillPaymentEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [bill, transaction]
          properties:
            bill:
              $ref: '#/components/schemas/Bill'
            transaction:
              $ref: '#/components/schemas/Transaction'
        trace_id: { type: string, format: uuid }
    BillPaymentsEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [payments]
          properties:
            payments:
              type: array
              items:
                $ref: '#/components/schemas/BillPayment'
        trace_id: { type: string, format: uuid }
    BillsEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [bills]
          properties:
            bills:
              type: array
              items:
                $ref: '#/components/schemas/Bill'
        trace_id: { type: string, format: uuid }
    BillEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/Bill'
        trace_id: { type: string, format: uuid }
    BillActiveEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [active]
          properties:
            active: { type: boolean }
        trace_id: { type: string, format: uuid }

    # ------------------------------------------------------------- budgets
    BudgetRow:
      type: object
      required: [id, category_id, category_name, essential, amount_minor, spent_minor]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        category_name: { type: string }
        essential: { type: boolean }
        amount_minor: { type: integer, format: int64 }
        spent_minor: { type: integer, format: int64 }
    BudgetsEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [budgets]
          properties:
            period: { type: string }
            budgets:
              type: array
              items:
                $ref: '#/components/schemas/BudgetRow'
        trace_id: { type: string, format: uuid }
    BudgetEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/BudgetRow'
        trace_id: { type: string, format: uuid }
    DeletedEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { type: boolean, enum: [true] }
        trace_id: { type: string, format: uuid }

    # ------------------------------------------------------------ overview
    Overview:
      type: object
      required: [sts_minor, runway_days, daily_allowance_minor, reserved_tomorrow_minor, essential_minor, lifestyle_minor, available_minor, reserved_minor, recent, badges]
      properties:
        sts_minor: { type: integer, format: int64 }
        runway_days: { type: integer, format: int64, description: 0 when burn ≤ 0 → render ∞ }
        daily_allowance_minor: { type: integer, format: int64 }
        reserved_tomorrow_minor: { type: integer, format: int64 }
        reserved_minor: { type: integer, format: int64 }
        available_minor: { type: integer, format: int64 }
        essential_minor: { type: integer, format: int64 }
        lifestyle_minor: { type: integer, format: int64 }
        recent:
          type: array
          items:
            $ref: '#/components/schemas/LedgerItem'
        badges:
          $ref: '#/components/schemas/BadgeCounts'
    OverviewEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/Overview'
        trace_id: { type: string, format: uuid }
    BadgeCounts:
      type: object
      required: [needs_review, hold_queue, bills_overdue]
      properties:
        needs_review: { type: integer, format: int64 }
        hold_queue: { type: integer, format: int64 }
        bills_overdue: { type: integer, format: int64, description: active bills whose due date has passed }
    BadgesEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/BadgeCounts'
        trace_id: { type: string, format: uuid }

    # ----------------------------------------------------------- analytics
    CategoryBreakdownNode:
      type: object
      required: [category_id, name, essential, amount_minor, share]
      properties:
        category_id: { type: string, format: uuid }
        name: { type: string }
        essential: { type: boolean }
        amount_minor: { type: integer, format: int64, description: includes descendants }
        share: { type: number, description: fraction of total_minor }
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreakdownNode'
    CategoryBreakdownEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [total_minor, categories]
          properties:
            total_minor: { type: integer, format: int64 }
            categories:
              type: array
              items:
                $ref: '#/components/schemas/CategoryBreakdownNode'
        trace_id: { type: string, format: uuid }
    IncomeExpenseBucket:
      type: object
      required: [week_start, income_minor, expense_minor]
      properties:
        week_start: { type: string, format: date }
        income_minor: { type: integer, format: int64 }
        expense_minor: { type: integer, format: int64, description: positive magnitude }
    IncomeExpenseEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [buckets]
          properties:
            buckets:
              type: array
              items:
                $ref: '#/components/schemas/IncomeExpenseBucket'
        trace_id: { type: string, format: uuid }
    StsPoint:
      type: object
      required: [date, sts_minor, runway_days]
      properties:
        date: { type: string, format: date }
        sts_minor: { type: integer, format: int64 }
        runway_days: { type: integer, format: int64 }
    StsTrendEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [points]
          properties:
            points:
              type: array
              items:
                $ref: '#/components/schemas/StsPoint'
        trace_id: { type: string, format: uuid }
    HeatmapDay:
      type: object
      required: [date, outflow_minor, anomaly]
      properties:
        date: { type: string, format: date }
        outflow_minor: { type: integer, format: int64 }
        anomaly: { type: boolean }
    HeatmapEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [days, mean_minor, std_minor]
          properties:
            days:
              type: array
              items:
                $ref: '#/components/schemas/HeatmapDay'
            mean_minor: { type: integer, format: int64 }
            std_minor: { type: integer, format: int64 }
        trace_id: { type: string, format: uuid }
    TopMerchant:
      type: object
      required: [name, amount_minor, tx_count]
      properties:
        name: { type: string }
        amount_minor: { type: integer, format: int64 }
        tx_count: { type: integer, format: int64 }
    TopMerchantsEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [merchants]
          properties:
            merchants:
              type: array
              items:
                $ref: '#/components/schemas/TopMerchant'
        trace_id: { type: string, format: uuid }
    EssentialLifestyleEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [essential_minor, lifestyle_minor]
          properties:
            essential_minor: { type: integer, format: int64 }
            lifestyle_minor: { type: integer, format: int64 }
        trace_id: { type: string, format: uuid }

    # ----------------------------------------------------------- hold queue
    PendingAction:
      type: object
      required: [id, kind, params, summary, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [capture, refund, create_transaction, receipt]
          description: |
            `capture` — a WhatsApp capture the rules refused to finish;
            `refund` — a linked reversal awaiting confirmation;
            `create_transaction` — a parked write from another surface;
            `receipt` — a photographed receipt, one ledger line per item.
        params:
          type: object
          additionalProperties: true
          description: |
            Kind-specific payload. A `capture` carries `type`,
            `amount_minor`, `merchant`, `source_id`/`source_name`,
            `destination_source_id`, `category_id`, `occurred_at`,
            `message_id`, `original_text` and `missing` (the fields the
            bot could not resolve). A `refund` carries
            `reverses_transaction_id`, `merchant`, `amount_minor`,
            `source_name`, `occurred_at`, `message_id`, `original_text`.
            A `receipt` carries `type`, `document_type`, `merchant`,
            `total_minor`, `items[] {n, name, qty, amount_minor,
            category_id, category_name, category_confidence}`,
            `source_id`/`source_name`, `occurred_at`, `receipt_date`,
            `payment_method`, `message_id`, `original_text`,
            `duplicate_of`, `inconsistent`, `missing`. `inconsistent` —
            the printed lines did not add up to the printed total; each
            line's `amount_minor` is a proportional share of
            `total_minor`.
        summary: { type: string }
        created_at: { type: string, format: date-time }
    HoldQueueEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PendingAction'
        trace_id: { type: string, format: uuid }
    ResolvedEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [resolved]
          properties:
            resolved: { type: boolean, enum: [true] }
            transaction_id:
              type: string
              format: uuid
              description: |
                Present when confirming executed a parked draft; the
                first written transaction for a multi-line receipt.
            transaction_ids:
              type: array
              description: Every transaction the confirmation wrote — one per receipt line.
              items:
                type: string
                format: uuid
        trace_id: { type: string, format: uuid }

    # ------------------------------------------------------------ settings
    Settings:
      type: object
      required: [income_horizon_days, reminder_hour]
      properties:
        income_horizon_days: { type: integer, minimum: 1, maximum: 90 }
        photo_default_source_id: { type: string, format: uuid, nullable: true, description: Source a photographed receipt falls back to; null means the bot asks }
        photo_default_source_name: { type: string, nullable: true }
        reminder_hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Asia/Jakarta hour the daily bill digest is sent (ADR-0006)
    SettingsEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/Settings'
        trace_id: { type: string, format: uuid }

    # ----------------------------------------------------------- admin: llm
    LLMProvider:
      type: object
      required: [source, base_url, model, vision_model, timeout_seconds, vision_timeout_seconds, api_key_set, api_key_last4, enabled]
      properties:
        source:
          type: string
          enum: [dashboard, env]
          description: Where the configuration in effect came from.
        base_url: { type: string, format: uri, example: 'https://api.openai.com/v1' }
        model: { type: string, example: gpt-4o-mini }
        vision_model: { type: string, description: Model for receipt photos; empty reuses `model`. }
        timeout_seconds: { type: integer, minimum: 1, maximum: 60 }
        vision_timeout_seconds: { type: integer, minimum: 1, maximum: 120 }
        api_key_set: { type: boolean, description: A key is installed. The key itself is never returned. }
        api_key_last4: { type: string, description: Last four characters of the installed key; empty when none. }
        enabled: { type: boolean, description: The bot will call the provider (a key is installed). }
    LLMProviderUpdate:
      type: object
      required: [base_url, model, timeout_seconds, vision_timeout_seconds]
      properties:
        base_url: { type: string, format: uri, example: 'https://api.openai.com/v1' }
        api_key:
          type: string
          nullable: true
          description: >-
            Absent or null keeps the stored key; "" clears it and turns AI
            off; any other value replaces it.
        model: { type: string, example: gpt-4o-mini }
        vision_model: { type: string, description: Empty reuses `model` for receipt photos. }
        timeout_seconds: { type: integer, minimum: 1, maximum: 60 }
        vision_timeout_seconds: { type: integer, minimum: 1, maximum: 120 }
    LLMModels:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { type: string }
    LLMTest:
      type: object
      required: [ok, latency_ms, model]
      properties:
        ok: { type: boolean, enum: [true] }
        latency_ms: { type: integer, format: int64 }
        model: { type: string }
    LLMProviderEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/LLMProvider'
        trace_id: { type: string, format: uuid }
    LLMModelsEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/LLMModels'
        trace_id: { type: string, format: uuid }
    LLMTestEnvelope:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/LLMTest'
        trace_id: { type: string, format: uuid }
