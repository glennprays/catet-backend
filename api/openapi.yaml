  /api/v1/hold-queue:
    get:
      summary: Parked pending actions awaiting confirmation
      operationId: listHoldQueue
      tags: [HoldQueue]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pending actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldQueueEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/hold-queue/{id}/resolve:
    post:
      summary: Confirm (execute) or discard a parked pending action
      operationId: resolveHoldQueueItem
      tags: [HoldQueue]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [confirm, discard] }
                overrides:
                  type: object
                  description: |
                    Corrections applied to a parked capture or receipt
                    before it is written. Ignored for `discard`. Every
                    field is optional; omitted fields keep whatever the
                    bot stored. For a receipt, `amount_minor` is rejected
                    (the printed total is immutable); `items[]` sets a
                    category per line by `n`; `collapse: true` writes one
                    line at the printed total instead (mutually exclusive
                    with `items`).
                  properties:
                    amount_minor: { type: integer, format: int64 }
                    source_id: { type: string, format: uuid }
                    destination_source_id: { type: string, format: uuid }
                    category_id: { type: string, format: uuid }
                    merchant: { type: string }
                    note: { type: string }
                    occurred_date: { type: string, format: date }
                    collapse: { type: boolean }
                    items:
                      type: array
                      items:
                        type: object
                        required: [n]
                        properties:
                          n: { type: integer, minimum: 1 }
                          category_id: { type: string, format: uuid }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ErrorResponse'

